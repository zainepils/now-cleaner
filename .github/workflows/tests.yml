name: Synthetic regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests using fictional files and mocked Google services
        run: python -m unittest discover -s tests -v
        env:
          OPENAI_API_KEY: ''
          NOW_CLEANER_UI_TESTS: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
      - name: Build Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm 'NOW Cleaner.spec'
          python scripts/windows_smoke.py 'dist/NOW Cleaner/NOW Cleaner.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/package_windows.ps1
      - name: Upload Windows download and build evidence
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NOW-Cleaner-Windows-preview
          path: dist/windows-release/*
          if-no-files-found: error
